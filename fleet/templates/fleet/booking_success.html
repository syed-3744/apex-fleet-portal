<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reservation Confirmed | Apex Fleet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0b0e14;
      color: #f3f4f6;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #141923;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
      max-width: 480px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 style="color: #4ade80;">✓ Reservation Confirmed!</h1>
    <p>Thank you, <strong>{{ customer_name }}</strong>.</p>
    <p>Your booking for the <strong>{{ car.brand }} {{ car.model_name }}</strong> is locked in for <strong>{{ total_days }} day(s)</strong>.</p>
    <h2 style="color: #6366f1;">Total: ₹{{ total_price|floatformat:0 }}</h2>
    <a href="{% url 'car_catalog' %}" class="btn">Back to Fleet</a>
  </div>
</body>
</html>
